<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-labelledby="title desc">
  <title id="title">SeniorOS engine status</title>
  <desc id="desc">Animated icons for the Risk Engine, Proof Engine, and Project Memory.</desc>
  <rect width="960" height="170" rx="24" fill="#0a1321"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(85 30)">
      <rect width="230" height="110" rx="18" fill="#0e1c30" stroke="#294866"/>
      <path d="M45 22l18 7v14c0 13-8 22-18 28-10-6-18-15-18-28V29l18-7z" fill="none" stroke="#60a5fa" stroke-width="3">
        <animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <text x="88" y="48" font-size="18" font-weight="700" fill="#f8fafc">Risk Engine</text>
      <text x="88" y="75" font-size="13" fill="#8498b5">scale rigor to blast radius</text>
    </g>

    <g transform="translate(365 30)">
      <rect width="230" height="110" rx="18" fill="#0e1c30" stroke="#294866"/>
      <circle cx="45" cy="47" r="22" fill="none" stroke="#315274" stroke-width="3"/>
      <path d="M34 47l8 8 16-19" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="34" stroke-dashoffset="34">
        <animate attributeName="stroke-dashoffset" values="34;0;0" keyTimes="0;.45;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <text x="88" y="48" font-size="18" font-weight="700" fill="#f8fafc">Proof Engine</text>
      <text x="88" y="75" font-size="13" fill="#8498b5">real checks over confidence</text>
    </g>

    <g transform="translate(645 30)">
      <rect width="230" height="110" rx="18" fill="#0e1c30" stroke="#294866"/>
      <g fill="none" stroke="#60a5fa" stroke-width="3">
        <ellipse cx="45" cy="31" rx="18" ry="7"/>
        <path d="M27 31v31c0 4 8 7 18 7s18-3 18-7V31"/>
        <path d="M27 43c0 4 8 7 18 7s18-3 18-7M27 55c0 4 8 7 18 7s18-3 18-7"/>
        <animate attributeName="stroke-opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/>
      </g>
      <text x="88" y="48" font-size="18" font-weight="700" fill="#f8fafc">Project Memory</text>
      <text x="88" y="75" font-size="13" fill="#8498b5">decisions survive sessions</text>
    </g>
  </g>
</svg>