<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">SeniorOS — Engineering discipline for coding agents</title>
  <desc id="desc">SeniorOS flow from goal contract through context, risk, proof, review and ship gate. Created by Josh Segatt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1b"/>
      <stop offset="1" stop-color="#0e1a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7db8ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="1335" cy="120" r="190" fill="#2563eb" opacity=".07" filter="url(#soft)"/>
  <circle cx="230" cy="520" r="140" fill="#60a5fa" opacity=".035" filter="url(#soft)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="800" y="110" text-anchor="middle" font-size="76" font-weight="750" fill="#f8fafc">Senior<tspan fill="url(#accent)">OS</tspan></text>
    <text x="800" y="160" text-anchor="middle" font-size="29" font-weight="560" fill="#d8e3f2">Engineering discipline for coding agents</text>
    <text x="800" y="202" text-anchor="middle" font-size="18" letter-spacing="1.2" fill="#8fa2bd">Risk-aware execution · Deterministic verification · Evidence-backed completion</text>

    <g transform="translate(74 266)">
      <line x1="120" y1="69" x2="1332" y2="69" stroke="#21344f" stroke-width="2"/>

      <g transform="translate(0 0)">
        <rect x="0" y="0" width="210" height="138" rx="20" fill="#0c1728" stroke="#29415f"/>
        <circle cx="105" cy="44" r="16" fill="none" stroke="#64a8ff" stroke-width="3"/>
        <circle cx="105" cy="44" r="5" fill="#64a8ff"/>
        <text x="105" y="91" text-anchor="middle" font-size="19" font-weight="650" fill="#f1f5f9">Goal Contract</text>
        <text x="105" y="116" text-anchor="middle" font-size="13" fill="#6f87a6">intent + success criteria</text>
      </g>

      <g transform="translate(244 0)">
        <rect x="0" y="0" width="210" height="138" rx="20" fill="#0c1728" stroke="#29415f"/>
        <path d="M82 46h46M82 38h46M82 54h46" stroke="#64a8ff" stroke-width="3" stroke-linecap="round"/>
        <text x="105" y="91" text-anchor="middle" font-size="19" font-weight="650" fill="#f1f5f9">Context Router</text>
        <text x="105" y="116" text-anchor="middle" font-size="13" fill="#6f87a6">only what matters</text>
      </g>

      <g transform="translate(488 0)">
        <rect x="0" y="0" width="210" height="138" rx="20" fill="#0c1728" stroke="#29415f"/>
        <path d="M105 28l19 7v15c0 13-8 23-19 29-11-6-19-16-19-29V35l19-7z" fill="none" stroke="#64a8ff" stroke-width="3"/>
        <text x="105" y="91" text-anchor="middle" font-size="19" font-weight="650" fill="#f1f5f9">Risk Engine</text>
        <text x="105" y="116" text-anchor="middle" font-size="13" fill="#6f87a6">rigor scales with risk</text>
      </g>

      <g transform="translate(732 0)">
        <rect x="0" y="0" width="210" height="138" rx="20" fill="#0c1728" stroke="#29415f"/>
        <circle cx="105" cy="46" r="20" fill="none" stroke="#64a8ff" stroke-width="3"/>
        <path d="M95 46l7 7 14-16" fill="none" stroke="#64a8ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="105" y="91" text-anchor="middle" font-size="19" font-weight="650" fill="#f1f5f9">Proof Engine</text>
        <text x="105" y="116" text-anchor="middle" font-size="13" fill="#6f87a6">tests + build + evidence</text>
      </g>

      <g transform="translate(976 0)">
        <rect x="0" y="0" width="210" height="138" rx="20" fill="#0c1728" stroke="#29415f"/>
        <rect x="85" y="28" width="34" height="42" rx="6" fill="none" stroke="#64a8ff" stroke-width="3"/>
        <circle cx="119" cy="66" r="12" fill="#0c1728" stroke="#64a8ff" stroke-width="3"/>
        <line x1="128" y1="75" x2="138" y2="85" stroke="#64a8ff" stroke-width="3" stroke-linecap="round"/>
        <text x="105" y="91" text-anchor="middle" font-size="19" font-weight="650" fill="#f1f5f9">Review Engine</text>
        <text x="105" y="116" text-anchor="middle" font-size="13" fill="#6f87a6">regressions + scope</text>
      </g>

      <g transform="translate(1220 0)">
        <rect x="0" y="0" width="210" height="138" rx="20" fill="#0d1d33" stroke="#4d91ef" stroke-width="1.5"/>
        <path d="M104 27c17 7 26 21 26 36l-16-5-9 15-9-15-16 5c0-15 9-29 24-36z" fill="none" stroke="#75b5ff" stroke-width="3" stroke-linejoin="round"/>
        <text x="105" y="91" text-anchor="middle" font-size="19" font-weight="650" fill="#f8fafc">Ship Gate</text>
        <text x="105" y="116" text-anchor="middle" font-size="13" fill="#8eb7eb">ship · not proven · blocked</text>
      </g>
    </g>

    <g transform="translate(188 474)">
      <rect x="0" y="0" width="270" height="58" rx="14" fill="#0b1524" stroke="#203550"/>
      <text x="135" y="36" text-anchor="middle" font-size="16" font-weight="620" fill="#cfe0f5">Project Memory</text>
      <rect x="300" y="0" width="270" height="58" rx="14" fill="#0b1524" stroke="#203550"/>
      <text x="435" y="36" text-anchor="middle" font-size="16" font-weight="620" fill="#cfe0f5">Work Ledger</text>
      <rect x="600" y="0" width="270" height="58" rx="14" fill="#0b1524" stroke="#203550"/>
      <text x="735" y="36" text-anchor="middle" font-size="16" font-weight="620" fill="#cfe0f5">Skill Router</text>
      <rect x="900" y="0" width="270" height="58" rx="14" fill="#0b1524" stroke="#203550"/>
      <text x="1035" y="36" text-anchor="middle" font-size="16" font-weight="620" fill="#cfe0f5">Evals</text>
    </g>

    <text x="800" y="575" text-anchor="middle" font-size="14" letter-spacing="3" fill="#7186a1">CREATED BY</text>
    <text x="800" y="608" text-anchor="middle" font-size="28" font-weight="740" fill="#f8fafc">Josh <tspan fill="#60a5fa">Segatt</tspan></text>
  </g>
</svg>