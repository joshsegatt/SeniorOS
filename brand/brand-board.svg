<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="SeniorOS brand system"><rect width="1600" height="1000" fill="#F8FAFC"/><text x="80" y="95" fill="#0B1220" font-size="62" font-weight="780" font-family="Inter,Segoe UI,Arial,sans-serif">SeniorOS Brand System</text><text x="80" y="140" fill="#64748B" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif">Clean engineering identity · v1 · Josh Segatt</text><rect x="80" y="200" width="680" height="300" rx="28" fill="#0B1220"/><g transform="translate(135 255) scale(1.1)"><path d="M74 19 50 6 21 23 49 40 76 55 49 72 21 57" fill="none" stroke="#6BB6FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g><text x="250" y="342" fill="#F8FAFC" font-size="72" font-weight="780" font-family="Inter,Segoe UI,Arial,sans-serif">Senior<tspan fill="#6BB6FF">OS</tspan></text><text x="135" y="430" fill="#9FB1C7" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="2">ENGINEERING DISCIPLINE FOR CODING AGENTS</text><text x="830" y="238" fill="#0B1220" font-size="30" font-weight="720" font-family="Inter,Segoe UI,Arial,sans-serif">Core palette</text><g transform="translate(830 275)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"><rect width="300" height="78" rx="16" fill="#0B1220"/><text x="324" y="35" fill="#0B1220">Midnight</text><text x="324" y="58" fill="#64748B">#0B1220</text><g transform="translate(0 98)"><rect width="300" height="78" rx="16" fill="#2F80FF"/><text x="324" y="35" fill="#0B1220">Signal Blue</text><text x="324" y="58" fill="#64748B">#2F80FF</text></g><g transform="translate(0 196)"><rect width="300" height="78" rx="16" fill="#6BB6FF"/><text x="324" y="35" fill="#0B1220">Sky</text><text x="324" y="58" fill="#64748B">#6BB6FF</text></g></g><line x1="80" y1="560" x2="1520" y2="560" stroke="#D7E0EA"/><text x="80" y="630" fill="#0B1220" font-size="30" font-weight="720" font-family="Inter,Segoe UI,Arial,sans-serif">Typography</text><text x="80" y="690" fill="#0B1220" font-size="42" font-weight="740" font-family="Inter,Segoe UI,Arial,sans-serif">Inter / system sans</text><text x="80" y="735" fill="#64748B" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif">Readable UI, documentation and product surfaces.</text><text x="80" y="810" fill="#0B1220" font-size="26" font-weight="700" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">JetBrains Mono / system mono</text><text x="80" y="850" fill="#64748B" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif">Commands, logs, code examples and technical labels.</text><text x="930" y="630" fill="#0B1220" font-size="30" font-weight="720" font-family="Inter,Segoe UI,Arial,sans-serif">Voice</text><text x="930" y="690" fill="#334155" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif">Precise · Calm · Verifiable · Practical</text><text x="930" y="740" fill="#64748B" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif">No sci-fi claims. No “magic”. No fake certainty.</text><text x="930" y="790" fill="#64748B" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif">Prefer evidence, boundaries and explicit status.</text><text x="80" y="948" fill="#64748B" font-size="17" letter-spacing="1.5" font-family="Inter,Segoe UI,Arial,sans-serif">SENIOROS · OPEN SOURCE · CREATED BY JOSH SEGATT</text></svg>