      <g fill="none" stroke="#EF4444" stroke-opacity="0.75" stroke-width="2">
        <rect x="901" y="270" width="26" height="26" rx="5"/><rect x="937" y="270" width="26" height="26" rx="5"/><rect x="973" y="270" width="26" height="26" rx="5"/><rect x="1009" y="270" width="26" height="26" rx="5"/><rect x="1045" y="270" width="26" height="26" rx="5"/><rect x="1081" y="270" width="26" height="26" rx="5"/><rect x="1117" y="270" width="26" height="26" rx="5"/><rect x="1153" y="270" width="26" height="26" rx="5"/><rect x="1189" y="270" width="26" height="26" rx="5"/><rect x="1225" y="270" width="26" height="26" rx="5"/><rect x="1261" y="270" width="26" height="26" rx="5"/><rect x="1297" y="270" width="26" height="26" rx="5"/><rect x="1333" y="270" width="26" height="26" rx="5"/><rect x="1369" y="270" width="26" height="26" rx="5"/><rect x="1405" y="270" width="26" height="26" rx="5"/>
