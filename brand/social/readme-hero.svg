<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d">
  <title id="t">SeniorOS: coding agents that prove their work</title>
  <desc id="d">Measured on Claude Opus, three held-out tasks where a bug is reported in one module and caused in another, five trials each: Opus alone fixed 0 of 15, with Superpowers 0 of 15, with SeniorOS 15 of 15.</desc>
  <style>
    .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <rect width="1600" height="620" rx="20" fill="#07101E"/>
  <rect x="0.5" y="0.5" width="1599" height="619" rx="20" fill="none" stroke="#263853"/>

  <!-- Left: who it is for and what it does -->
  <g transform="translate(80 78) scale(0.86)">
    <path d="M74 19 50 6 21 23 49 40 76 55 49 72 21 57" fill="none" stroke="#2F80FF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="ui" x="162" y="128" fill="#F8FAFC" font-size="44" font-weight="700" letter-spacing="-0.5">SeniorOS</text>

  <text class="ui" x="80" y="246" fill="#F8FAFC" font-size="62" font-weight="700" letter-spacing="-1.6">Coding agents that</text>
  <text class="ui" x="80" y="318" fill="#F8FAFC" font-size="62" font-weight="700" letter-spacing="-1.6">prove their work.</text>

  <text class="ui" x="80" y="384" fill="#94A3B8" font-size="25">Skills, a guard for destructive commands and a</text>
  <text class="ui" x="80" y="420" fill="#94A3B8" font-size="25">finish gate that runs your checks before "done".</text>

  <rect x="80" y="486" width="246" height="56" rx="12" fill="none" stroke="#2F80FF"/>
  <text class="mono" x="104" y="522" fill="#F8FAFC" font-size="24"><tspan fill="#94A3B8">$ </tspan>npx senioros</text>
  <text class="ui" x="352" y="509" fill="#94A3B8" font-size="22">Claude Code · Codex · Cursor · OpenCode</text>
  <text class="ui" x="352" y="541" fill="#94A3B8" font-size="22">Antigravity · Grok · Apache-2.0</text>

  <!-- Right: one real result, every run shown -->
  <rect x="860" y="72" width="660" height="476" rx="12" fill="none" stroke="#263853"/>
  <text class="ui" x="900" y="128" fill="#F8FAFC" font-size="28" font-weight="600">A bug reported in one module,</text>
  <text class="ui" x="900" y="164" fill="#F8FAFC" font-size="28" font-weight="600">caused in another</text>
  <text class="ui" x="900" y="202" fill="#94A3B8" font-size="22">Claude Opus · 3 held-out tasks × 5 trials · hidden tests</text>

